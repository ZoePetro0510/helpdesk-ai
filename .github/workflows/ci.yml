name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API lint + unit tests
    runs-on: ubuntu-24.04  # pinned: Playwright 1.55 install-deps supports 24.04, not 26
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt
      - run: pip install -r requirements.txt ruff
      - run: ruff check .
      - run: pytest -q

  web:
    name: Web type-check + build
    runs-on: ubuntu-24.04  # pinned: Playwright 1.55 install-deps supports 24.04, not 26
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  e2e:
    name: Full stack (Docker) + eval gate + Playwright
    needs: [api, web]
    runs-on: ubuntu-24.04  # pinned: Playwright 1.55 install-deps supports 24.04, not 26
    env:
      LLM_PROVIDER: stub        # deterministic rules: no model or API key in CI
      API_PORT: "18000"
      WEB_PORT: "18080"
      N8N_PORT: "15678"
      DB_HOST_PORT: "15433"
      INTERNAL_TOKEN: ci-internal-token
      N8N_ENCRYPTION_KEY: ci-n8n-encryption-key
    steps:
      - uses: actions/checkout@v4

      - name: Start db, api, n8n and web
        run: docker compose up -d --build --wait

      - name: Integration tests (inside the api container)
        run: docker compose exec -T api pytest -q

      - name: Eval quality gate
        run: >
          docker compose exec -T api python -m eval.run_eval --judge
          --min-hit 0.9 --max-unsafe 0 --min-grounded 0.9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Playwright
        working-directory: web
        run: npm ci && npx playwright install --with-deps chromium
      - name: Playwright end-to-end tests
        working-directory: web
        run: npx playwright test

      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
      - name: Service logs
        if: failure()
        run: docker compose logs --no-color
