services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-helpdesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-helpdesk}
    ports:
      - "${DB_HOST_PORT:-5433}:5432"  # 5433 on the host, so a local PostgreSQL on 5432 doesn't clash
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-helpdesk} -d ${POSTGRES_DB:-helpdesk}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # FastAPI agent: indexes the knowledge base on start, then serves on :8000
  api:
    build: ./api
    image: helpdesk-api
    env_file:
      - path: .env
        required: false  # CI runs without a .env file
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-change-me-internal}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-helpdesk}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-helpdesk}
      OLLAMA_URL: http://host.docker.internal:11434  # Ollama runs on the host (uses the Mac's GPU)
      TICKET_BACKEND: n8n
      N8N_TICKET_WEBHOOK: http://n8n:5678/webhook/create-ticket
      RUN_INTEGRATION: "1"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./data:/data:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10

  # Self-hosted n8n (free): intake webhook and ticket creation. Workflows live in n8n/workflows.
  n8n:
    image: n8nio/n8n:1.123.98
    entrypoint: ["tini", "--", "/bin/sh", "/init/init.sh"]
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-change-me-n8n-key}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-change-me-internal}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"  # workflows read INTERNAL_TOKEN from the environment
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_SECURE_COOKIE: "false"  # local http only
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      WEBHOOK_URL: http://localhost:${N8N_PORT:-5678}/
      GENERIC_TIMEZONE: Asia/Jerusalem
    ports:
      - "${N8N_PORT:-5678}:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
      - ./n8n/init.sh:/init/init.sh:ro
    depends_on:
      api:
        condition: service_healthy

  # React web app (employee form, approval queue, history, dashboard) on :8080
  web:
    build: ./web
    image: helpdesk-web
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  n8n_data:
