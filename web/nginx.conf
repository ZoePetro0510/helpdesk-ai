server {
  listen 80;
  root /usr/share/nginx/html;

  # API calls go to the api container; the agent can take a while with a local model
  location /api/ {
    proxy_pass http://api:8000/;
    proxy_read_timeout 180s;
  }

  # Hashed build assets never change: cache them for a long time
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Single-page app; index.html is never cached, so a new build shows up right away
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
